version: "2.0"

run:
  id: "<stable-run-id>"
  seed: 42
  generator_version: "<code/model/prompt version or hash>"
  quality_level: "calibration|production"
  accepted_cases: 20
  candidate_budget: 35
  repair_budget_per_case: 1
  pilot:
    enabled: true
    limit_units: 5
    review_sample_rate: 0.4

intent:
  question: "<one precise quality question>"
  scenarios:
    - "<scenario/edge case to cover>"
  out_of_scope:
    - "<explicit exclusion>"

agent_contract:
  input:
    description: "<what one fixture contains>"
    schema_ref: "<path/version or prose contract>"
  output:
    description: "<expected agent output>"
    schema_ref: "<path/version or prose contract>"

# Shape/style/distribution only. A reference is not truth unless explicitly
# repeated below as a labeled reference-answer source.
input_references:
  - id: "input-reference-1"
    path: "<repo-relative sanitized path>"
    revision: "<hash/version>"
    family: "<structural family>"
    anchor_candidate: true
    hold_out_candidate: false

# Correctness sources, in explicit precedence order. Never include secrets.
truth_sources:
  - id: "truth-source-1"
    path: "<standard/schema/validator/labeled-pair path>"
    revision: "<hash/version>"
    kind: "executable|rule-grounded|reference-answer|judge-rubric"
    priority: 1

correctness:
  description: "<operational rule for deriving the right answer>"
  evaluation_unit: "<smallest independently checkable unit>"
  expected_output_shape: "<semantic schema>"
  equivalence_rule: "<when two differently shaped answers mean the same>"
  ambiguity_policy: "quarantine|human-adjudication"

evaluation_axis:
  - id: "axis-1"
    description: "<independently checkable requirement/dimension>"
    truth_source_ids: ["truth-source-1"]

oracle:
  strongest_allowed: "executable|rule-grounded|reference-answer|judge"
  executable_command: "<safe command or N/A>"
  judge_rubric_ref: "<path or N/A>"
  probe:
    known_good: "<fixture/reference with known answer>"
    changed_case: "<controlled semantic change>"
    required_evidence: "<machine result or cited rule evidence>"

coverage:
  dimensions:
    - "evaluation_axis"
    - "structural_family"
    - "difficulty"
  difficulties: ["obvious", "subtle", "false_positive"]
  allow_multi_unit_cases: false
  assignment_algorithm: "seeded-stratified-round-robin"

size_contract:
  method: "<serialized-bytes|tokens|rows|N/A>"
  buckets: ["<bucket definitions or N/A>"]

# Used later by harness-eval:golden; synthesis does not run the tested agent.
comparison:
  method: "exact|field-level|coverage|execution-match|semantic|llm-judge"
  threshold: "<task-specific threshold>"
  repeat_count: 1

verification:
  require_fresh_context: true
  minimum_verifiers: 1
  agreement_rule: "<exact/semantic/evidence-backed adjudication>"
  verifier_input_allowlist:
    - "fixture"
    - "truth_sources"
    - "correctness_and_equivalence_rules"
    - "expected_output_schema"

review:
  prioritize: ["quarantine", "borderline", "false_positive"]
  approver: "<role/name>"

output:
  work_root: "work/<run_id>"
  fixtures_root: "fixtures/<run_id>"
  dataset: "report/<run_id>-dataset.jsonl"
  audit: "report/<run_id>-audit.yaml"
  quarantine: "report/<run_id>-quarantine.yaml"
  canonical_summary: "docs/harness/evals/golden-synthesis.md"

data_policy:
  synthetic_only: true
  allow_pii: false
  allow_confidential_fragments: false
  allowed_storage: "<repo-relative path or approved external system>"
  retention: "<policy>"
  external_oracle_authorization: "N/A|<approver/scope/reference>"
