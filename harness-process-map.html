html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;harness-process-full&quot; aria-label=&quot;Понятная схема переноса прототипа агента в готовый сервис&quot;&gt;
  &lt;style&gt;
    #harness-process-full {
      --font-size-base: 16px;
      --phase-a: color-mix(in srgb, var(--viz-series-1) 76%, var(--background));
      --phase-b: color-mix(in srgb, var(--viz-series-2) 76%, var(--background));
      --phase-c: color-mix(in srgb, var(--viz-series-3) 76%, var(--background));
      width: 100%;
      color: var(--foreground);
      font-size: var(--font-size-base);
    }

    #harness-process-full * {
      box-sizing: border-box;
    }

    #harness-process-full .process-sheet {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      padding-inline: 20px;
    }

    #harness-process-full .route {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding-block: 12px 20px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 62%, transparent);
      text-align: center;
    }

    #harness-process-full .route-phase {
      display: inline-grid;
      place-items: center;
      inline-size: 32px;
      block-size: 32px;
      border-radius: 50%;
      font-weight: 500;
      background: color-mix(in srgb, var(--phase-color) 11%, transparent);
    }

    #harness-process-full .route-a {
      --phase-color: var(--phase-a);
    }

    #harness-process-full .route-b {
      --phase-color: var(--phase-b);
    }

    #harness-process-full .route-c {
      --phase-color: var(--phase-c);
    }

    #harness-process-full .arrow {
      color: var(--muted-foreground);
    }

    #harness-process-full .hint {
      margin: 9px 0 0;
      text-align: center;
    }

    #harness-process-full .stage {
      --phase: var(--phase-a);
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(0, 3fr);
      gap: 40px;
      align-items: center;
      padding-block: 22px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 62%, transparent);
    }

    #harness-process-full .stage-b {
      --phase: var(--phase-b);
    }

    #harness-process-full .stage-c {
      --phase: var(--phase-c);
    }

    #harness-process-full .stage-heading {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }

    #harness-process-full .stage-letter {
      display: grid;
      place-items: center;
      inline-size: 40px;
      block-size: 40px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--phase) 11%, transparent);
      font-weight: 500;
    }

    #harness-process-full .stage h2,
    #harness-process-full .stage p {
      margin: 0;
    }

    #harness-process-full .stage p {
      margin-top: 6px;
      color: var(--muted-foreground);
    }

    #harness-process-full .track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    #harness-process-full .track::before {
      content: &quot;&quot;;
      position: absolute;
      inset-inline: 11%;
      inset-block-start: 14px;
      block-size: 2px;
      background: var(--border);
    }

    #harness-process-full .stop {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
      text-align: center;
    }

    #harness-process-full .stop-mark {
      display: grid;
      place-items: center;
      inline-size: 29px;
      block-size: 29px;
      border-radius: 50%;
      background: var(--background);
      border: 2px solid var(--phase);
      color: var(--foreground);
      font-weight: 500;
    }

    #harness-process-full .stop-mark.gate {
      border-radius: 3px;
      transform: rotate(45deg) scale(0.78);
    }

    #harness-process-full .stop-mark.gate span {
      transform: rotate(-45deg) scale(1.22);
    }

    #harness-process-full .stop .btn {
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.3;
    }

    #harness-process-full .detail {
      margin-block: 20px 15px;
    }

    #harness-process-full .detail-line {
      margin: 0;
    }

    #harness-process-full .detail-label,
    #harness-process-full .plain-label {
      font-weight: 500;
    }

    #harness-process-full .always {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 11px;
      align-items: baseline;
      padding-block: 11px;
      border-block: 1px solid color-mix(in srgb, var(--border) 62%, transparent);
    }

    #harness-process-full details {
      margin-top: 11px;
    }

    #harness-process-full summary {
      cursor: pointer;
      color: var(--muted-foreground);
    }

    #harness-process-full .situational {
      margin: 8px 0 0;
      color: var(--muted-foreground);
    }

    @media (max-width: 900px) {
      #harness-process-full .process-sheet {
        padding-inline: 14px;
      }

      #harness-process-full .stage {
        grid-template-columns: 1fr;
        gap: 17px;
      }
    }

    @media (max-width: 540px) {
      #harness-process-full .process-sheet {
        padding-inline: 8px;
      }

      #harness-process-full .track {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 5px;
      }

      #harness-process-full .track::before {
        inset-inline-start: 19px;
        inset-inline-end: auto;
        inset-block: 14px;
        inline-size: 2px;
        block-size: auto;
      }

      #harness-process-full .stop {
        grid-template-columns: 29px 1fr;
        justify-items: start;
        align-items: center;
        text-align: start;
      }
    }
  &lt;/style&gt;

  &lt;h1 class=&quot;sr-only&quot;&gt;Как Harness превращает прототип агента в готовый сервис&lt;/h1&gt;

  &lt;div class=&quot;process-sheet&quot;&gt;

  &lt;div class=&quot;route&quot; aria-label=&quot;Общий маршрут&quot;&gt;
    &lt;span&gt;Прототип агента + ответы на вопросы о будущем сервисе&lt;/span&gt;
    &lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;route-phase route-a&quot;&gt;A&lt;/span&gt;
    &lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;route-phase route-b&quot;&gt;B&lt;/span&gt;
    &lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;route-phase route-c&quot;&gt;C&lt;/span&gt;
    &lt;span class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
    &lt;span&gt;Сервис готов к использованию&lt;/span&gt;
  &lt;/div&gt;

  &lt;p class=&quot;hint text-small text-muted&quot;&gt;Нажмите на название шага — ниже появится простое объяснение.&lt;/p&gt;

  &lt;section class=&quot;stage stage-a&quot; aria-labelledby=&quot;plain-phase-a&quot;&gt;
    &lt;div class=&quot;stage-heading&quot;&gt;
      &lt;span class=&quot;stage-letter&quot; aria-hidden=&quot;true&quot;&gt;A&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plain-phase-a&quot;&gt;Сохраняем то, что уже работает&lt;/h2&gt;
        &lt;p&gt;Записываем работу прототипа понятными шагами, собираем новую версию и проверяем, что она даёт тот же результат.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;track&quot; aria-label=&quot;Шаги этапа A&quot;&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;true&quot; data-phase=&quot;A&quot; data-title=&quot;Собрать всё необходимое&quot; data-skills=&quot;harness-context + harness-doctor&quot; data-detail=&quot;Находим прототип, создаём место для новой версии и собираем нужные примеры и решения. Если чего-то не хватает, сначала спрашиваем ответственного человека.&quot;&gt;Собрать всё необходимое&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;A&quot; data-title=&quot;Разобрать прототип&quot; data-skills=&quot;harness-source-analysis + harness-ds-precheck&quot; data-detail=&quot;Составляем понятную карту: что агент получает, какие действия выполняет, какой результат выдаёт и что происходит при ошибке. Ничего не додумываем.&quot;&gt;Разобрать прототип&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;A&quot; data-title=&quot;Собрать новую версию&quot; data-skills=&quot;harness-prototype-plan → harness-work-session → harness-prototype-port&quot; data-detail=&quot;Делим работу на небольшие задачи и переносим одну часть за другой. Перед началом сохраняем точное описание того, как ведёт себя прототип.&quot;&gt;Собрать новую версию&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;4&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;A&quot; data-title=&quot;Сравнить с прототипом&quot; data-skills=&quot;harness-eval:prototype-parity&quot; data-detail=&quot;Даём прототипу и новой версии одинаковые примеры. Их результаты должны совпасть. Если появляется важное отличие, продолжение подтверждает человек.&quot;&gt;Сравнить с прототипом&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;stage stage-b&quot; aria-labelledby=&quot;plain-phase-b&quot;&gt;
    &lt;div class=&quot;stage-heading&quot;&gt;
      &lt;span class=&quot;stage-letter&quot; aria-hidden=&quot;true&quot;&gt;B&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plain-phase-b&quot;&gt;Готовим к реальной работе&lt;/h2&gt;
        &lt;p&gt;Решаем, откуда сервис будет получать данные и куда отдавать результат. Затем добавляем всё, что нужно для стабильной и безопасной работы.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;track&quot; aria-label=&quot;Шаги этапа B&quot;&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;B&quot; data-title=&quot;Решить, откуда брать данные&quot; data-skills=&quot;harness-productionize + human-owned spec&quot; data-detail=&quot;В прототипе данные часто читаются из файлов. Для настоящего сервиса человек заранее решает, откуда они будут приходить и куда уходить. Он также утверждает их вид, правила доступа, ошибки и владельца.&quot;&gt;Решить, откуда брать данные&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;B&quot; data-title=&quot;Составить план работ&quot; data-skills=&quot;harness-extract-prod + harness-production-plan&quot; data-detail=&quot;Сравниваем будущий сервис с правилами и примерами команды. Из найденных отличий составляем короткий список конкретных работ.&quot;&gt;Составить план работ&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;3&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;B&quot; data-title=&quot;Подключить внешние системы&quot; data-skills=&quot;harness-work-session + harness-production-readiness&quot; data-detail=&quot;Настраиваем утверждённые источники и получателей данных. Адреса, содержимое запросов, доступы и действия при ошибках берём из согласованного описания, а не угадываем.&quot;&gt;Подключить внешние системы&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;4&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;B&quot; data-title=&quot;Подготовить к поддержке&quot; data-skills=&quot;harness-production-readiness + harness-governance-gates&quot; data-detail=&quot;Готовим понятные правила запуска и поддержки, чтобы после передачи сервисом могла пользоваться команда.&quot;&gt;Подготовить к поддержке&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;stage stage-c&quot; aria-labelledby=&quot;plain-phase-c&quot;&gt;
    &lt;div class=&quot;stage-heading&quot;&gt;
      &lt;span class=&quot;stage-letter&quot; aria-hidden=&quot;true&quot;&gt;C&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;plain-phase-c&quot;&gt;Проверяем и выпускаем&lt;/h2&gt;
        &lt;p&gt;Проверяем запуск с нуля, работу с настоящими внешними системами и весь путь данных. После этого передаём сервис команде.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;track&quot; aria-label=&quot;Шаги этапа C&quot;&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;1&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;C&quot; data-title=&quot;Запустить с нуля&quot; data-skills=&quot;harness-production-readiness:deploy&quot; data-detail=&quot;Проверяем, что новую версию можно установить на чистом компьютере или сервере и запустить одной понятной командой.&quot;&gt;Запустить с нуля&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;2&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;C&quot; data-title=&quot;Проверить внешние системы&quot; data-skills=&quot;harness-eval:live&quot; data-detail=&quot;Только после отдельного разрешения проверяем работу с настоящими внешними системами на безопасных тестовых данных.&quot;&gt;Проверить внешние системы&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;C&quot; data-title=&quot;Проверить всё целиком&quot; data-skills=&quot;harness-production-readiness:stand&quot; data-detail=&quot;Проверяем полный путь: сервис запускается, принимает данные, выдаёт правильный результат и выполняет только разрешённые действия.&quot;&gt;Проверить всё целиком&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stop&quot;&gt;
        &lt;span class=&quot;stop-mark gate&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;4&lt;/span&gt;&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; aria-pressed=&quot;false&quot; data-phase=&quot;C&quot; data-title=&quot;Передать команде&quot; data-skills=&quot;harness-production-readiness:runbook + harness-productionize&quot; data-detail=&quot;Готова инструкция по запуску и поддержке, назначены ответственные люди, а известные ограничения записаны и приняты. После этого человек подтверждает выпуск.&quot;&gt;Передать команде&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;card detail&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;
    &lt;p class=&quot;detail-line&quot;&gt;&lt;span class=&quot;detail-label&quot;&gt;A · Собрать всё необходимое&lt;/span&gt; — &lt;span class=&quot;detail-text&quot;&gt;Находим прототип, создаём место для новой версии и собираем нужные примеры и решения. Если чего-то не хватает, сначала спрашиваем ответственного человека.&lt;/span&gt; &lt;span class=&quot;plain-label&quot;&gt;Skills:&lt;/span&gt; &lt;code class=&quot;detail-skills&quot;&gt;harness-context + harness-doctor&lt;/code&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;always text-small&quot; aria-label=&quot;Правила, действующие на всём маршруте&quot;&gt;
    &lt;span class=&quot;plain-label&quot;&gt;На всём маршруте:&lt;/span&gt;
    &lt;span&gt;одна небольшая задача за раз&lt;/span&gt;
    &lt;span&gt;→&lt;/span&gt;
    &lt;span&gt;проверка результата&lt;/span&gt;
    &lt;span&gt;→&lt;/span&gt;
    &lt;span&gt;сохранение доказательств&lt;/span&gt;
    &lt;code&gt;harness-productionize&lt;/code&gt;
    &lt;code&gt;harness-work-session&lt;/code&gt;
    &lt;code&gt;harness-pre-commit-check&lt;/code&gt;
    &lt;code&gt;harness-governance-gates&lt;/code&gt;
  &lt;/div&gt;

  &lt;details&gt;
    &lt;summary class=&quot;text-small&quot;&gt;Показать дополнительные и редкие skills&lt;/summary&gt;
    &lt;p class=&quot;situational text-small&quot;&gt;&lt;code&gt;harness-request-exec&lt;/code&gt; — передаёт команды в удалённое окружение; &lt;code&gt;harness-golden&lt;/code&gt; → &lt;code&gt;harness-eval:golden&lt;/code&gt; — опционально измеряет качество по отдельному эталону; &lt;code&gt;harness-scan&lt;/code&gt; — помогает в workspace с несколькими репозиториями; &lt;code&gt;harness-template&lt;/code&gt; — создаёт новый сервис из шаблона; &lt;code&gt;harness-extract-patterns&lt;/code&gt; — извлекает соглашения команды; &lt;code&gt;harness-team-layout-alignment&lt;/code&gt; — исправляет структуру только при доказанной необходимости.&lt;/p&gt;
  &lt;/details&gt;

  &lt;p class=&quot;text-small text-muted&quot;&gt;Ромб означает: перед этим шагом ответственному человеку нужно подтвердить решение.&lt;/p&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;harness-process-full&#x27;);
      const buttons = Array.from(root.querySelectorAll(&#x27;button[data-phase]&#x27;));
      const label = root.querySelector(&#x27;.detail-label&#x27;);
      const skills = root.querySelector(&#x27;.detail-skills&#x27;);
      const detail = root.querySelector(&#x27;.detail-text&#x27;);

      const selectStep = (button) =&gt; {
        buttons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        label.textContent = `${button.dataset.phase} · ${button.dataset.title}`;
        skills.textContent = button.dataset.skills;
        detail.textContent = button.dataset.detail;
      };

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectStep(button));
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
